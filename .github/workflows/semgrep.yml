# Semgrep → GitHub Code Scanning (SARIF рядом с CodeQL)
name: Semgrep

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan (SARIF)
        # findings → non-zero exit; всё равно грузим SARIF в Code scanning
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/ruby \
            --config p/javascript \
            --config p/rails \
            --sarif \
            --output=semgrep.sarif

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        if: always()
