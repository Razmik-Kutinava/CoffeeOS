# Deploy to Fly — ТОЛЬКО ручной запуск (workflow_dispatch).
# Автодеплой на push отключён: каждый deploy будит Neon compute ($).
# Апрув владельца: GitHub Actions → Deploy to Fly.io → Run workflow.
# Локально: fly deploy -a coffeeos (тоже только по решению владельца).

name: Deploy to Fly.io

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --depot=false -a coffeeos
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl scale count web=1 worker=1 --yes -a coffeeos
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
