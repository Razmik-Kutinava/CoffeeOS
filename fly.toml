# fly.toml — CoffeeOS deploy config
# Docs: https://fly.io/docs/reference/configuration/

app = "coffeeos"
primary_region = "ams"

[build]

[env]
  APP_HOST          = "coffeeos.fly.dev"
  # SHOP_BASE_DOMAIN не задаём: на Fly нет DNS/TLS для {slug}.coffeeos.fly.dev (см. FLY_DEMO_STAND.md).
  # После своего домена: SHOP_BASE_DOMAIN = "shop.example.com" + fly certs + wildcard CNAME.
  PORT              = "3000"
  RAILS_ENV         = "production"
  RAILS_LOG_TO_STDOUT = "true"
  RAILS_SERVE_STATIC_FILES = "true"
  WEB_CONCURRENCY   = "0"
  RAILS_MAX_THREADS = "3"
  # Worker (bin/jobs): Solid Queue threads + dispatchers > RAILS_MAX_THREADS; иначе crash loop на prod.
  DB_POOL           = "8"
  # Период живого демо на develop→Fly: идемпотентный demo:seed после каждого деплоя.
  # Убрать demo:seed из release_command после закрытия H.3 (см. veha_1/CHECKLIST § H.0).
  DEMO_AUTO_SEED    = "true"
  # Solid Queue на web — fallback если worker machine stopped (UserCards webhook RebillId).
  SOLID_QUEUE_IN_PUMA = "true"
  # Отдельный worker (bin/jobs). После deploy проверить: fly machines list — worker=started.
  # Если stopped: fly machines start <id> -a coffeeos  (scale count worker=1 уже задан).

[processes]
  web    = "./bin/rails server -b 0.0.0.0"
  worker = "./bin/jobs"

# Миграции + демо-данные перед трафиком (coffeeos = стенд develop, не main/prod).
[deploy]
  # sleep 2 — сеть Fly иногда не готова сразу; echo — ранний stdout до boot Rails.
  release_command = "sh -c 'echo [fly:release] starting && sleep 2 && bin/rails fly:release'"
  release_command_timeout = "10m"

  [deploy.release_command_vm]
    size   = "shared-cpu-2x"
    memory = "2048mb"

[http_service]
  processes = ["web"]
  internal_port = 3000
  force_https   = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size   = "shared-cpu-1x"
  memory = "1024mb"

[checks]
  [checks.health]
    processes    = ["web"]
    grace_period = "180s"
    interval     = "15s"
    method       = "GET"
    path         = "/up"
    port         = 3000
    timeout      = "10s"
    type         = "http"
