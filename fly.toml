# fly.toml — CoffeeOS deploy config
# Docs: https://fly.io/docs/reference/configuration/

app = "coffeeos"
primary_region = "ams"

[build]

[env]
  APP_HOST          = "coffeeos.fly.dev"
  SHOP_BASE_DOMAIN  = "coffeeos.fly.dev"
  PORT              = "3000"
  RAILS_ENV         = "production"
  RAILS_LOG_TO_STDOUT = "true"
  RAILS_SERVE_STATIC_FILES = "true"
  WEB_CONCURRENCY   = "0"
  RAILS_MAX_THREADS = "3"
  # Период живого демо на develop→Fly: идемпотентный demo:seed после каждого деплоя.
  # Убрать demo:seed из release_command после закрытия H.3 (см. veha_1/CHECKLIST § H.0).
  DEMO_AUTO_SEED    = "true"

# Миграции + демо-данные перед трафиком (coffeeos = стенд develop, не main/prod).
[deploy]
  release_command = "bin/rails fly:release"

[http_service]
  internal_port = 3000
  force_https   = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size   = "shared-cpu-1x"
  memory = "1024mb"

[checks]
  [checks.health]
    grace_period = "180s"
    interval     = "15s"
    method       = "GET"
    path         = "/up"
    port         = 3000
    timeout      = "10s"
    type         = "http"
